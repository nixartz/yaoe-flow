# Minimal GLOBAL goose config for the image (orchestrator + goose). Copied to
# /root/.config/goose/config.yaml in Dockerfile.goose.
#
# Goal: a LEAN, DETERMINISTIC toolset. By default goose enables ~16 bundled
# extensions (analyze, todo, tom, memory, …) → hundreds of tools, which HURTS
# model tool-selection and encourages context/scope leakage. Here we only
# leave `developer` on (shell/fs/git). Per-role MCPs (linear/github) come from
# the RECIPE, not from here — so each agent ends up with: developer + the
# recipe's MCPs.
#
# Note: every extension must be listed with `enabled: false` (omitting it is
# not enough — goose re-injects any missing defaults). Provider/model come
# from env (GOOSE_PROVIDER/GOOSE_MODEL + OPENROUTER_API_KEY), set in the
# Dockerfile/.env.
extensions:
  developer:
    enabled: true
    type: platform
    name: developer
    bundled: true
  todo:
    enabled: false
    type: platform
    name: todo
    bundled: true
  tom:
    enabled: false
    type: platform
    name: tom
    bundled: true
  analyze:
    enabled: false
    type: platform
    name: analyze
    bundled: true
  apps:
    enabled: false
    type: platform
    name: apps
    bundled: true
  skills:
    enabled: false
    type: platform
    name: skills
    bundled: true
  yaoe-flow:
    enabled: false
    type: platform
    name: orchestrator
    bundled: true
  extensionmanager:
    enabled: false
    type: platform
    name: Extension Manager
    bundled: true
  code_execution:
    enabled: false
    type: platform
    name: code_execution
    bundled: true
  chatrecall:
    enabled: false
    type: platform
    name: chatrecall
    bundled: true
  summarize:
    enabled: false
    type: platform
    name: summarize
    bundled: true
  summon:
    enabled: false
    type: platform
    name: summon
    bundled: true
  computercontroller:
    enabled: false
    type: builtin
    name: computercontroller
    bundled: true
  memory:
    enabled: false
    type: builtin
    name: memory
    bundled: true
  autovisualiser:
    enabled: false
    type: builtin
    name: autovisualiser
    bundled: true
  tutorial:
    enabled: false
    type: builtin
    name: tutorial
    bundled: true
