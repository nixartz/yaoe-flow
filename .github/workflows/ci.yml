name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Contract suite: ACP client + normalization + liveness against the
      # mock-acp-agent — no LLM cost, no real CLI, no network flakiness. Along
      # with the other unit tests (secrets/config/migrations/users/agents/
      # budgets) it runs in seconds.
      - run: bun test
      # Dashboard: separate typecheck (full SPA build happens in release; here we
      # only guarantee the screens compile).
      - name: dashboard typecheck
        working-directory: dashboard
        run: |
          bun install --frozen-lockfile
          bunx tsc -b --pretty false

      # Guardrail: the committed embed stub must not contain a baked SPA
      # (stale UI would ship if release forgot to rebuild).
      - name: assert SPA not committed in embed stub
        working-directory: app
        run: |
          bun -e '
            import { EMBEDDED_DASHBOARD_ASSETS } from "./src/embedded-assets.generated.ts";
            const n = Object.keys(EMBEDDED_DASHBOARD_ASSETS).length;
            if (n !== 0) {
              console.error(`EMBEDDED_DASHBOARD_ASSETS has ${n} entries — run: bun run embed-assets -- --no-dashboard`);
              process.exit(1);
            }
            console.log("ok: SPA embed stub is empty");
          '

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks CLI directly (the gitleaks-action requires a paid license for
      # organization accounts; the CLI does not).
      - name: gitleaks
        run: |
          curl -sSL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact .
