name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Contract suite: ACP client + normalization + liveness against the
      # mock-acp-agent — no LLM cost, no real CLI, no network flakiness. Along
      # with the other unit tests (secrets/config/migrations/users/agents/
      # budgets) it runs in seconds.
      - run: bun test
      # Dashboard: separate typecheck (full build happens in release; here we
      # only guarantee the screens compile).
      - name: dashboard typecheck
        working-directory: dashboard
        run: |
          bun install --frozen-lockfile
          bunx tsc -b --pretty false

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks CLI directly (the gitleaks-action requires a paid license for
      # organization accounts; the CLI does not).
      - name: gitleaks
        run: |
          curl -sSL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact .
